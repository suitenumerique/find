name: Main Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  project-quality:
    if: github.event_name == 'pull_request' # Makes sense only for pull requests
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_project-quality.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      print_check_paths: src/backend
      codespell_ignore_words: statics,excpt,nin,caf,afe,ist

  changelog:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_changelog.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1

  lint-back:
    permissions:
      contents: read
    uses: suitenumerique/ci/.github/workflows/_python-lint.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      working_directory: src/backend
      pylint_targets: .

  test-back:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: find
          POSTGRES_USER: dinum
          POSTGRES_PASSWORD: pass
        ports:
          - 5432:5432
        # needed because the postgres container does not provide a healthcheck
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      opensearch:
        image: opensearchproject/opensearch:latest
        env:
          discovery.type: single-node
          plugins.security.disabled: true
          plugins.security.ssl.http.enabled: false
          OPENSEARCH_INITIAL_ADMIN_PASSWORD: find.PASS123
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -s http://localhost:9200 > /dev/null || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_CONFIGURATION: Test
      DJANGO_SETTINGS_MODULE: find.settings
      DJANGO_SECRET_KEY: ThisIsAnExampleKeyForTestPurposeOnly
      OIDC_OP_JWKS_ENDPOINT: /endpoint-for-test-purpose-only
      DB_HOST: localhost
      DB_NAME: find
      DB_USER: dinum
      DB_PASSWORD: pass
      DB_PORT: 5432
      STORAGES_STATICFILES_BACKEND: django.contrib.staticfiles.storage.StaticFilesStorage
      OPENSEARCH_HOST: localhost
      OPENSEARCH_PASSWORD: find.PASS123
      OPENSEARCH_USE_SSL: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create writable /data
        run: |
          sudo mkdir -p /data/media && \
          sudo mkdir -p /data/static

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version-file: "src/backend/pyproject.toml"
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Wait for OpenSearch to be ready
        run: |
          for i in {1..60}; do
            if curl -s http://localhost:9200 > /dev/null; then
              echo "OpenSearch is ready"
              exit 0
            fi
            echo "Waiting for OpenSearch... attempt $i"
            sleep 1
          done
          echo "OpenSearch failed to start"
          exit 1

      - name: Install the dependencies
        run: uv sync --locked --all-extras

      - name: Run tests
        run: uv run pytest
